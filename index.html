function fmt(n){
  if(!isFinite(n)) return '∞';
  const a=Math.abs(n);
  if(a<1000) return String(Math.round(n*10)/10).replace('.',',');
  if(a>=1e15) return n.toExponential(2).replace('e+','e').replace('.',',');
  const u=['k','M','B','T'];let v=n,i=-1;
  while(Math.abs(v)>=1000&&i<3){v/=1000;i++}
  return v.toFixed(v<10?2:v<100?1:0).replace('.',',')+u[i];
}

const DEFS={

  cantina:{n:'Cantina',ic:'🍷',r:'común',p:5,col:'#7a2c4a',d:'+1 mult por cada tipo distinto de vagón',fire:(c,w,ti,hi)=>c.addM(hi,new Set(c.tr.map(x=>x.k)).size)},
  pasajeros:{n:'Pasajeros',ic:'🧳',r:'común',p:4,col:'#4f7a52',d:w=>`+${w.s.p} mult. Sube 1 pasajero por vuelta`,init:w=>w.s.p=2,fire:(c,w,ti,hi)=>c.addM(hi,w.s.p),lapEnd:w=>{w.s.p+=1}},
  guarda:{n:'Guarda',ic:'🎫',r:'común',p:4,col:'#3d4a7a',d:'+1 mult. +2 boletos al final de cada vuelta',fire:(c,w,ti,hi)=>c.addM(hi,1),lapEnd:w=>{S.money+=2;S.extra+=2}},
  carbonera:{n:'Carbonera',ic:'⚫',r:'rara',p:6,col:'#222',d:'El vagón de atrás se activa una vez más'},

  senal:{n:'Señal',ic:'🚦',r:'rara',p:6,col:'#2f7a3a',d:'×2 a la carga que vas juntando',fire:(c,w,ti,hi)=>c.xC(hi,2)},
  postal:{n:'Correo',ic:'✉️',r:'rara',p:6,col:'#b8862f',d:'+3 carga por cada boleto que tenés',fire:(c,w,ti,hi)=>c.addC(hi,3*S.money)},
  farol:{n:'Farol',ic:'🏮',r:'rara',p:6,col:'#e0a030',d:'×1,5 mult por cada lugar vacío del tren',fire:(c,w,ti,hi)=>{const e=S.slots-(c.tr.length-1);e>0?c.xM(hi,Math.pow(1.5,e)):c.nada(hi)}},
  chatarrero:{n:'Chatarrero',ic:'🔧',r:'rara',p:6,col:'#6b5a4a',d:()=>`×${fmt(1+0.3*S.sold)} mult. +0,3 por cada vagón que vendiste`,fire:(c,w,ti,hi)=>c.xM(hi,1+0.3*S.sold)},

const SPOTS=8;
const TILES={
  anden:{n:'Andén',col:'#7d8597',d:'El tren se activa normal.'},
  mina:{n:'Mina',col:'#c9902a',d:'Locomotora, Caldera, Tolva y Furgón rinden ×3. +1 por cada Mina pegada.'},
  lecheria:{n:'Lechería',col:'#e8e2d0',d:'Tambos, Pasajeros y Cantinas se activan 3 veces.'},
  deposito:{n:'Depósito',col:'#7f77dd',d:'No suma: guarda lo que hace ×1,5 y lo agrega a la próxima estación.'},
  farol:{n:'Farol',col:'#e0603a',d:'No se activa: la próxima estación vale ×2. Cada Farol más suma ×1.'},
  cruce:{n:'Cruce',col:'#1d9e75',d:'El tren se activa al revés, de atrás para adelante.'},
  feria:{n:'Feria',col:'#d4537e',d:'Arranca con +2 mult por cada estación de la vía.'},
  capilla:{n:'Capilla',col:'#9fb6c8',d:'Acá todos los vagones tienen +1 nivel.'},
  galpon:{n:'Galpón',col:'#8a6a3e',d:'Todo el tren se activa 2 veces.'},
  fantasma:{n:'Pueblo fantasma',col:'#b48ad8',d:'Repite el pueblo anterior de la vía.'},
  quiniela:{n:'Quiniela',col:'#ffd25a',d:'Al final, ×1 a ×6 al azar.'},
};
const MINA_K=['loco','caldera','tolva','furgon'],LECHE_K=['tambo','pasajeros','cantina'];
const order=tk=>tk.map((t,i)=>t?i:-1).filter(i=>i>=0);
function resolveTile(tk,i){let j=i,seen=0;while(tk[j]&&tk[j].k==='fantasma'&&seen<SPOTS){const ord=order(tk),p=ord.indexOf(j);j=ord[(p-1+ord.length)%ord.length];seen++}return tk[j]&&tk[j].k!=='fantasma'?tk[j].k:null}
// arma las opciones de cálculo para una parada
function stOpts(tk,i,tr){
  const k=resolveTile(tk,i),o={tile:k};
  if(k==='mina'){let f=3;[-1,1].forEach(d=>{const n=tk[(i+d+SPOTS)%SPOTS];if(n&&n.k==='mina')f++});o.boost={};MINA_K.forEach(x=>o.boost[x]=f)}
  if(k==='lecheria'){o.reps={};LECHE_K.forEach(x=>o.reps[x]=3)}
  if(k==='feria')o.m0=1+2*order(tk).length;
  if(k==='capilla')o.lv=1;
  if(k==='galpon')o.passes=2;
  if(k==='cruce'){o.rev=true}
  return o;
}
function runStation(tr,o,live){
  let t=tr,map=null;
  if(o.rev){t=tr.slice().reverse();map=t.map((_,j)=>tr.length-1-j)}
  return evaluate(t,live,{...o,map});
}
// simula una vuelta entera (sin azar ni inspector) para las vistas previas
function lapRun(tr,tk){
  let carry=0,nx=1,tot=0;
  for(const i of order(tk)){
    const o=stOpts(tk,i,tr);
    if(o.tile==='farol'){nx+=1;continue}
    if(!o.tile)continue;
    o.add=carry;carry=0;o.x=nx*(o.tile==='quiniela'?3.5:1);nx=1;
    const v=runStation(tr,o,false);
    if(o.tile==='deposito')carry+=v*1.5;else tot+=v;
  }
  return tot;
}
Object.keys(DEFS).forEach(k=>DEFS[k].key=k);
const BASE_POOL=['caldera','tanque','furgon','tambo','tolva','cantina','dinamita','carbonera'];

/* ---------- el ramal (meta) ---------- */

const LINES=['En 1993 cerraron el ramal. El tren no se enteró.','Boleto, por favor. Ah, no hay nadie.','Cada vuelta pesa más. Será el óxido o la nostalgia.','El ramal no cierra mientras alguien lo recorra.','Si te para un inspector, decile que sos de la cooperativa.','El pasto creció entre los durmientes. Lo aplastamos con cariño.','Dicen que en la próxima hay gente esperando. Siempre dicen eso.'];

  {k:'viamuerta',n:'Vía muerta',q:0.6,noreward:1,d:'Cuota ×0,6. Sin premio.'},

];

function loadMeta(){try{const m=JSON.parse(localStorage.getItem('el-ramal-meta'));if(m&&Array.isArray(m.open))return m}catch(e){}return{open:[],best:0,runs:0,muted:false}}
function saveMeta(){try{localStorage.setItem('el-ramal-meta',JSON.stringify(meta))}catch(e){}}
let meta=loadMeta();
const isOpen=n=>meta.open.includes(n);
function pool(){const p=[...BASE_POOL];STATIONS.forEach(s=>{if(isOpen(s.n)&&s.u&&DEFS[s.u])p.push(s.u)});return p}

/* ---------- sonido ---------- */
let AC=null;
function beep(f,d=0.07,type='square',v=0.04){tone(f,d,type,v)}
const whistle=()=>{tone(392,0.7,'sine',0.05,{slide:330,atk:0.05});tone(466,0.75,'sine',0.035,{at:0.04,slide:392,atk:0.05})};
/* motor de sonido: todo sintetizado, cada vagón tiene su voz */
let MASTER=null,NOISE=null,voices=0;
function ac(){if(meta.muted)return null;try{if(!AC){AC=new AudioContext();const comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=6;MASTER=AC.createGain();MASTER.gain.value=0.9;MASTER.connect(comp).connect(AC.destination);
  const b=AC.createBuffer(1,AC.sampleRate,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;NOISE=b}
  if(!AC._amb){AC._amb=1;ambience()}
  if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function ambience(){try{const t=AC.currentTime,gn=AC.createGain(),lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=180;gn.gain.value=0.035;
  [55,55.6,82.4].forEach(f=>{const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=f;o.connect(lp);o.start(t)});
  const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=0.07;lg.gain.value=0.02;lfo.connect(lg).connect(gn.gain);lfo.start(t);
  const ws=AC.createBufferSource();ws.buffer=NOISE;ws.loop=true;const wf=AC.createBiquadFilter();wf.type='bandpass';wf.frequency.value=420;wf.Q.value=0.6;const wg=AC.createGain();wg.gain.value=0.02;ws.connect(wf).connect(wg).connect(MASTER);ws.start(t);
  lp.connect(gn).connect(MASTER)}catch(e){}}
function tone(f,d,type='square',v=0.04,o={}){const a=ac();if(!a||voices>48)return;const t=a.currentTime+(o.at||0),os=a.createOscillator(),gn=a.createGain();
  os.type=type;os.frequency.setValueAtTime(f,t);if(o.slide)os.frequency.exponentialRampToValueAtTime(Math.max(20,o.slide),t+d);
  if(o.vib){const l=a.createOscillator(),lg=a.createGain();l.frequency.value=o.vib;lg.gain.value=f*0.04;l.connect(lg).connect(os.frequency);l.start(t);l.stop(t+d+0.05)}
  gn.gain.setValueAtTime(0.0001,t);gn.gain.exponentialRampToValueAtTime(v,t+(o.atk||0.005));gn.gain.exponentialRampToValueAtTime(0.0001,t+d);
  let out=gn;if(o.lp){const fl=a.createBiquadFilter();fl.type='lowpass';fl.frequency.value=o.lp;gn.connect(fl);out=fl}
  os.connect(gn);out.connect(MASTER);os.start(t);os.stop(t+d+0.05);voices++;os.onended=()=>voices--}
function noise(d,v=0.05,o={}){const a=ac();if(!a||voices>48)return;const t=a.currentTime+(o.at||0),src=a.createBufferSource(),fl=a.createBiquadFilter(),gn=a.createGain();
  src.buffer=NOISE;src.playbackRate.value=o.rate||1;fl.type=o.type||'lowpass';fl.frequency.setValueAtTime(o.f||1200,t);if(o.f2)fl.frequency.exponentialRampToValueAtTime(o.f2,t+d);fl.Q.value=o.q||1;
  gn.gain.setValueAtTime(0.0001,t);gn.gain.exponentialRampToValueAtTime(v,t+(o.atk||0.004));gn.gain.exponentialRampToValueAtTime(0.0001,t+d);
  src.connect(fl).connect(gn).connect(MASTER);src.start(t,Math.random()*0.5);src.stop(t+d+0.05);voices++;src.onended=()=>voices--}
const SCALE=[0,3,5,7,10];
const ladder=n=>{const oct=Math.min(4,Math.floor(n/5)),deg=SCALE[n%5];return 196*Math.pow(2,(oct*12+deg)/12)};
const VOICE={
  loco:f=>{noise(0.12,0.06,{f:500});tone(f/2,0.1,'square',0.03,{lp:900})},
  caldera:f=>{noise(0.22,0.07,{f:400,f2:2500,type:'bandpass',q:0.7});tone(f,0.08,'square',0.03,{lp:2500})},
  tanque:f=>{tone(f*2,0.16,'sine',0.07,{slide:f*0.9})},
  tambo:f=>{tone(f/2,0.28,'sawtooth',0.05,{lp:700,vib:7,slide:f/2.4,atk:0.04})},
  furgon:f=>{tone(f,0.07,'triangle',0.06);noise(0.03,0.05,{f:3000,type:'highpass'})},
  tolva:f=>{tone(f,0.12,'square',0.03,{lp:3000});noise(0.09,0.05,{f:5000,type:'bandpass',q:4})},
  cantina:f=>{tone(f*4,0.3,'sine',0.04);tone(f*5.4,0.25,'sine',0.03,{at:0.01})},
  pasajeros:f=>{for(let i=0;i<3;i++)noise(0.05,0.04,{at:i*0.05,f:700+Math.random()*900,type:'bandpass',q:6});tone(f,0.08,'triangle',0.03)},
  guarda:f=>{tone(f*3,0.12,'sine',0.04,{slide:f*3.2});tone(1800,0.06,'square',0.02,{at:0.06})},
  carbonera:f=>{tone(110,0.1,'square',0.05,{lp:800});noise(0.15,0.05,{f:800,f2:6000,type:'bandpass',q:2})},
  espejo:f=>{for(let i=0;i<4;i++)tone(f*2*(1+i*0.5),0.35,'sine',0.02,{at:i*0.03})},
  dinamita:f=>{noise(0.6,0.16,{f:3000,f2:80});tone(70,0.5,'sine',0.14,{slide:35});shake(10)},
  senal:f=>{tone(f*3,0.18,'triangle',0.05);tone(f*3,0.18,'triangle',0.05,{at:0.12})},
  postal:f=>{noise(0.12,0.05,{f:2000,f2:6000,type:'bandpass',q:1});coin(f*2)},
  farol:f=>{tone(f,0.5,'sine',0.05,{atk:0.08});tone(f*1.5,0.5,'sine',0.03,{atk:0.1})},
  chatarrero:f=>{noise(0.2,0.08,{f:900,type:'bandpass',q:3,rate:0.6});tone(f,0.15,'sawtooth',0.03,{lp:1500})},
  comedor:f=>{for(let i=0;i<4;i++)tone(f*(1.5+Math.random()),0.06,'sine',0.04,{at:i*0.04,slide:f*3})},
  descarrilado:f=>{noise(1.0,0.2,{f:6000,f2:100});tone(180,0.9,'sawtooth',0.07,{slide:30,lp:1200});shake(22)},
  presidencial:f=>{[1,1.26,1.5,2].forEach((m,i)=>tone(f*m,0.45,'sawtooth',0.03,{at:i*0.05,lp:2200}))},
};
function coin(f=1400){tone(f,0.08,'square',0.03);tone(f*1.5,0.18,'square',0.03,{at:0.05})}
function boom(power){tone(55,0.25+power*0.1,'sine',Math.min(0.2,0.05+power*0.03),{slide:30});noise(0.15+power*0.08,Math.min(0.12,0.03+power*0.02),{f:800,f2:60})}
let shakeAmt=0;const shake=v=>{shakeAmt=Math.min(30,shakeAmt+v)};
let chugT=0;

/* ---------- estado ---------- */
let uid=0,S=null,speed=meta.speed||1;
function mk(k){const w={id:++uid,k,s:{}};if(DEFS[k].init)DEFS[k].init(w);return w}
const quotaFor=l=>Math.round(l<=5?10*Math.pow(3.3,l-1):1186*Math.pow(2.3,l-5));

function newRun(kind='carga'){
  const ST=STARTERS[kind]||STARTERS.carga;
  S={kind,endless:false,lap:1,money:ST.money,slots:4+(isOpen('Pueblo Ceniza')?1:0),train:[mk('loco'),...ST.train.map(mk)],track:Array(SPOTS).fill(null).map((_,i)=>i===0||i===4?{k:'anden'}:null),carry:0,nextMul:1,tileOffer:[],tilePick:null,tilePlaced:false,spotDelta:null,sold:0,phase:'travel',sel:null,
     t:0,nextSt:0,nst:4,quota:0,lapScore:0,route:ROUTES[0],boss:null,ev:[],evT:0,evPitch:220,shop:[],reroll:2,expand:8,
     nextRare:false,discount:0,extra:0,floaters:[],smoke:[],parts:[],pops:[],cm:[0,1],newOpen:[],hist:[],hot:{},combo:0,comboT:0,flash:0,bestSt:0,bestCombo:0};
  meta.runs++;saveMeta();
  beginLap(ROUTES[0]);
  showLine(meta.runs===1?'En 1993 cerraron el ramal. El tren no se enteró. Cada vuelta tiene una cuota de carga: si no la llenás, el ramal cierra.':rnd(LINES));
}
function beginLap(route){
  S.route=route;S.boss=S.nextBoss!==undefined?S.nextBoss:(S.lap%4===0?rnd(BOSSES):null);S.nextBoss=undefined;
  if(S.tutShop){meta.tut=true;saveMeta();S.tutShop=false}
  if(S.boss&&APP==='game'){S.bossCard=3.2;tone(98,0.9,'sawtooth',0.05,{lp:600});tone(73,1.2,'sine',0.06,{at:0.1})}
  S.order=order(S.track);S.nst=S.order.length;S.carry=0;S.nextMul=1;S.tilePick=null;S.spotDelta=null;S.quota=Math.round(quotaFor(S.lap)*(route.q||1)*(S.boss?1.15:1));

/* ---------- cálculo de una estación ---------- */
function evaluate(tr=S.train,live=true,o={}){
  const ev=[],boss=live&&S.boss&&S.boss.k;
  const c={carga:0,mult:o.m0||1,tr,L:1,B:1};
  let src=null;
  const push=(i,txt,cls)=>ev.push({i:o.map&&i>=0?o.map[i]:i,txt,cls,carga:c.carga,mult:c.mult,k:src,v:c._v});
  if(o.m0)push(-1,'feria: mult '+fmt(o.m0),'m');
  c.addC=(i,v)=>{v*=c.L*c.B;if(boss==='pesado')v/=2;c.carga+=v;push(i,'+'+fmt(v),'c')};
  c.addM=(i,v)=>{v*=c.L*c.B;c.mult+=v;push(i,'+'+fmt(v)+' mult','m')};
  c.xM=(i,v)=>{v=1+(v-1)*c.L;c.mult*=v;c._v=v;push(i,'×'+fmt(v),'x');c._v=0};
  c.xC=(i,v)=>{v=1+(v-1)*c.L;c.carga*=v;push(i,'×'+fmt(v)+' carga','x')};
  c.nada=i=>push(i,'nada','n');
  let passes=o.passes||1;
  for(let pass=0;pass<passes&&pass<6;pass++){
    if(pass>0)push(-1,'¡otra pasada!','r');
    const trig=tr.map(w=>(o.reps&&o.reps[w.k])||1);
    for(let i=0;i<tr.length;i++){
      if(boss==='angosta'&&i>3)continue;
      if(boss==='niebla'&&i<2){push(i,'niebla','n');continue}
      let ti=i;
      if(tr[i].k==='espejo'){let j=i-1;while(j>=0&&tr[j].k==='espejo')j--;if(j<0){c.nada(i);continue}ti=j}
      const tk=tr[ti].k,L=(tr[ti].lv||1)+(o.lv||0);src=tk;c.L=L;c.B=(o.boost&&o.boost[tk])||1;
      const reps=trig[i]*(tr[i].k==='espejo'?(tr[i].lv||1):1);
      for(let t=0;t<reps;t++){
        if(t>0)push(i,'¡otra vez!','r');
        if(tk==='carbonera'){if(i+1<tr.length){trig[i+1]+=L;push(i,'▶ +'+L+' al de atrás','r')}else c.nada(i);continue}
        if(tk==='descarrilado'){if(i===tr.length-1&&pass===0&&!c.derail){c.derail=1;passes+=Math.min(3,L);push(i,L>1?'¡DESCARRILA ×'+L+'!':'¡DESCARRILA!','r')}else c.nada(i);continue}
        DEFS[tk].fire(c,tr[ti],ti,i);
      }
    }
  }
  src=null;
  if(o.x&&o.x!==1){c.mult*=o.x;c._v=o.x;push(-1,'×'+fmt(o.x)+(o.tile==='quiniela'?' quiniela':' farol'),'x');c._v=0}
  const addv=(o.add||0)*(o.x||1);
  if(addv)push(-1,'+'+fmt(addv)+' del depósito','r');
  if(!live)return Math.min(1e300,Math.floor(c.carga*c.mult+addv));
  if(S.route.k==='tormenta'){c.carga*=0.75;push(-1,'tormenta ×0,75','n')}
  if(boss==='tope'&&c.mult>15){c.mult=15;push(-1,'tope 15','n')}
  const total=Math.min(1e300,Math.floor(c.carga*c.mult+addv));
  ev.push({i:-1,total,carga:c.carga,mult:c.mult});
  return ev;
}

    case 'espejo':{let j=i-1;while(j>=0&&tr[j].k==='espejo')j--;return j>=0?{ok:1,t:`Copia a ${nm(tr[j].k)}`}:{ok:0,t:'No tiene nada adelante'}}

    if(locked&&SEL_NO&&SEL_NO.k===k){SEL_NO.t-=1/60;const dx=SEL_NO.t>0.3?(Math.floor(SEL_NO.t*30)%2?2:-2):0;box(x+4+dx,y+148,cw-8,14,'#1e0810',C.blood,null);txtC('LLEGÁ A LA VUELTA '+st.req,x+cw/2+dx,y+152,C.mult,1,null);if(SEL_NO.t<=0)SEL_NO=null}
    hit(x,y,cw,170,{t:st.n,d:st.d},locked?()=>{SEL_NO={k,t:1.2};tone(110,0.25,'square',0.04,{lp:500});tone(92,0.3,'square',0.04,{at:0.08,lp:500})}:()=>startRun(k))});
  txtC('TU RÉCORD: VUELTA '+meta.best,SW/2,26,'#8a8a3a',1,null);
  menuBtn(SW/2-44,228,88,'VOLVER',true,goTitle);
  HOVER=MODAL?null:findHit(MOUSE);modalLayer();
}

const TRANSIENT=['ev','floaters','smoke','parts','pops','hot','spotDelta','tilePick','sel','_exit','combo','comboT','comboShow','flash','townFlash','cuotaFlash'];
function saveRun(){try{if(APP!=='game'||!S||S.phase==='over'||S.phase==='intro')return;const o={};for(const k in S)if(!TRANSIENT.includes(k))o[k]=S[k];localStorage.setItem('el-ramal-run',JSON.stringify({v:1,S:o}))}catch(e){}}
function dropRun(){try{localStorage.removeItem('el-ramal-run')}catch(e){}}
function loadRun(){try{const j=JSON.parse(localStorage.getItem('el-ramal-run'));if(!j||j.v!==1||!j.S||!j.S.train)return false;
  S=Object.assign({ev:[],floaters:[],smoke:[],parts:[],pops:[],hot:{},spotDelta:null,tilePick:null,sel:null,combo:0,comboT:0,flash:0},j.S);
  uid=Math.max(0,...S.train.map(w=>w.id||0));
  if(S.phase==='shop'){S.cm=[0,1];return true}
  S.nextBoss=S.boss||null;S.lapScore=0;beginLap(S.route);return true}catch(e){return false}}
setInterval(()=>{if(S&&S.phase==='shop')saveRun()},1500);
window.__ramal={get APP(){return APP},set APP(v){APP=v},goTitle,newGame,startRun,playCine,CINE_INTRO,CINE_END,get S(){return S},meta,evaluate,quotaFor,DEFS,endLap,beginLap,newRun,rollShop,evStep,render,renderPanel,VOICE,buy,owned,syn,lapRun,TILES,pickTile,placeTile,startEval,draw,get MODAL(){return MODAL},closeModal};
const BOT=location.search.includes('bot');
if(BOT){APP='game';newRun('carga')}else goTitle();
requestAnimationFrame(tick);
if(BOT){const b=document.createElement('script');b.src='bot.js';document.body.appendChild(b)}
</script>
